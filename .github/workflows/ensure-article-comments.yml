name: Ensure article comments

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  add-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add comments to generated articles
        run: |
          node --test scripts/ensure-giscus-comments.test.mjs
          node scripts/ensure-giscus-comments.mjs

      - name: Commit generated comment blocks
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)20??/??/??/*/index.html'
          git commit -m "chore: add comments to generated articles"
          git push
